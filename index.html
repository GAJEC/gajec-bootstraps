<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/styles.css" />
    <title>GAJEC BOOTSTRAPS</title>
  </head>
  <body>
    <div class="component-title">Buttons</div>
    <div class="section">Outline Buttons</div>
    <div class="btn-row">
      <button class="btn btn-outline">Default</button>
      <button class="btn btn-outline btn-sm">Small</button>
      <button class="btn btn-outline btn-lg">Large</button>
      <button class="btn btn-outline" disabled>Disabled</button>
    </div>

    <div class="section">Glass Buttons</div>
    <div class="btn-row">
      <button class="btn btn-glass">Default</button>
      <button class="btn btn-glass btn-sm">Small</button>
      <button class="btn btn-glass btn-lg">Large</button>
      <button class="btn btn-glass" disabled>Disabled</button>
    </div>

    <div class="section">Gradient Buttons</div>
    <div class="btn-row">
      <button class="btn btn-gradient">Default</button>
      <button class="btn btn-gradient btn-sm">Small</button>
      <button class="btn btn-gradient btn-lg">Large</button>
      <button class="btn btn-gradient" disabled>Disabled</button>
    </div>

    <div class="section">Fill Sweep Buttons</div>
    <div class="btn-row">
      <button class="btn btn-fill">Default</button>
      <button class="btn btn-fill btn-sm">Small</button>
      <button class="btn btn-fill btn-lg">Large</button>
      <button class="btn btn-fill" disabled>Disabled</button>
    </div>

    <div class="section">Radial Fill Buttons</div>
    <div class="btn-row">
      <button class="btn btn-radial">Default</button>
      <button class="btn btn-radial btn-sm">Small</button>
      <button class="btn btn-radial btn-lg">Large</button>
      <button class="btn btn-radial" disabled>Disabled</button>
    </div>

    <div class="section">Liquid Buttons</div>
    <div class="btn-row">
      <button class="btn btn-liquid">Default</button>
      <button class="btn btn-liquid btn-sm">Small</button>
      <button class="btn btn-liquid btn-lg">Large</button>
      <button class="btn btn-liquid" disabled>Disabled</button>
    </div>
    <hr class="divider" />

    <!-- NAVIGATION BAR -->
    <div class="component-title">Navigation Bar</div>
    <div class="section">Classic Navigation Bar</div>
    <nav class="navbar navbar-classic">
    <div class="container">
        <a class="navbar-brand" href="#">GAJEC Corp</a>
        <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="#">Products </a></li>
        <li class="nav-item"><a class="nav-link" href="#">Services </a></li>
        <li class="nav-item"><a class="nav-link" href="#">About Us </a></li>
        <li class="nav-item"><a class="nav-link" href="#">Insights</a></li>
        </ul>
        <div class="navbar-actions">
        <a href="#" class="btn-contact">Contact Us</a>
        </div>
    </div>
    </nav>

    <div class="section">Floating Navigation Bar</div>
    <div class="navbar-floating-wrap">
    <nav class="navbar-floating">
        <a class="navbar-brand" href="#"> <img src="gajec-logo.png" alt="" class="brand-icon"> GAJEC Corp</a>
        <div class="navbar-nav">
        <a class="nav-link" href="#">Features</a>
        <a class="nav-link" href="#">FAQ</a>
        <a class="nav-link" href="#">Pricing</a>
        </div>
        <a href="#" class="btn-download">Download</a>
    </nav>
    </div>

    
    </div>
  </body>
</html>
